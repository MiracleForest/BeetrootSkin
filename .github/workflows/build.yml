name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per supported LeviLamina line; the lip variant has the same name.
          - variant: "26_60"
            levilamina: 26.60.6
          - variant: "26_51"
            levilamina: 26.51.7
    name: build (LeviLamina ${{ matrix.levilamina }})
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ matrix.variant }}-${{ hashFiles('xmake.lua', 'locks/*.lock') }}
          restore-keys: |
            xmake-${{ matrix.variant }}-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: git config --global core.longpaths true

      - name: Pin the packages of this LeviLamina line
        shell: pwsh
        run: Copy-Item locks/${{ matrix.variant }}.lock xmake-requires.lock

      - run: xmake repo -u

      - run: xmake f -a x64 -m release -p windows -v --target_type=client --levilamina=${{ matrix.levilamina }} -y

      - run: xmake -v -y

      - name: Unit tests
        run: |
          xmake build -y beetroot-tests
          xmake run beetroot-tests

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-win-x64-ll${{ matrix.variant }}
          path: |
            bin/BeetrootSkin/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-sdk-client-win-x64-ll${{ matrix.variant }}
          path: |
            bin/BeetrootSkin-sdk/
