name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per supported LeviLamina line; the lip variant has the same name.
          - variant: "26_60"
            levilamina: 26.60.6
            line: "26.60"
          - variant: "26_51"
            levilamina: 26.51.7
            line: "26.51"
    name: build (LeviLamina ${{ matrix.levilamina }})
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ matrix.variant }}-${{ hashFiles('xmake.lua', 'locks/*.lock') }}
          restore-keys: |
            xmake-${{ matrix.variant }}-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: git config --global core.longpaths true

      - name: Pin the packages of this LeviLamina line
        shell: pwsh
        run: Copy-Item locks/${{ matrix.variant }}.lock xmake-requires.lock

      - run: xmake repo -u

      - run: xmake f -a x64 -m release -p windows -v --target_type=client --levilamina=${{ matrix.levilamina }} -y

      - run: xmake -v -y

      - name: Unit tests
        run: |
          xmake build -y beetroot-tests
          xmake run beetroot-tests

      - name: Check versions
        shell: pwsh
        run: |
          $expected = "${{ github.ref_name }}".TrimStart('v')
          $actual = (Get-Content bin/BeetrootSkin/manifest.json | ConvertFrom-Json).version
          if ($actual -ne $expected) { throw "manifest version $actual does not match tag $expected" }
          $declared = (Select-String -Path lip.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($declared -ne $expected) { throw "lip.toml version $declared does not match tag $expected" }

      - name: Package
        shell: pwsh
        run: |
          Copy-Item COPYING, COPYING.LESSER, README.md, README.zh-CN.md -Destination bin/BeetrootSkin/
          New-Item -ItemType Directory -Force bin/BeetrootSkin/textures | Out-Null
          Copy-Item assets/textures/NOTICE -Destination bin/BeetrootSkin/textures/NOTICE
          # lip's mcmod asset wants manifest.json at the root of the ZIP, with '/' separators.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path bin/BeetrootSkin).Path,
            (Join-Path (Get-Location) "beetrootskin-client-win-x64-ll${{ matrix.line }}.zip"),
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )
          # API SDK for other mods (headers + import library), see CONTRIBUTING.md "API".
          Copy-Item COPYING, COPYING.LESSER -Destination bin/BeetrootSkin-sdk/
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path bin/BeetrootSkin-sdk).Path,
            (Join-Path (Get-Location) "beetrootskin-sdk-client-win-x64-ll${{ matrix.line }}.zip"),
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )

      - uses: actions/upload-artifact@v7
        with:
          name: zip-${{ matrix.variant }}
          path: |
            beetrootskin-client-win-x64-ll${{ matrix.line }}.zip
            beetrootskin-sdk-client-win-x64-ll${{ matrix.line }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: zip-*
          merge-multiple: true

      - name: Release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $version" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[|^\[[^\]]+\]: ' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          ($body -join "`n").Trim() | Set-Content RELEASE_NOTES.md -Encoding utf8

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            beetrootskin-client-win-x64-ll26.60.zip
            beetrootskin-client-win-x64-ll26.51.zip
            beetrootskin-sdk-client-win-x64-ll26.60.zip
            beetrootskin-sdk-client-win-x64-ll26.51.zip
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
