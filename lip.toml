format = 4
id = "github.com/MiracleForest/BeetrootSkin"
version = "0.1.1"

[info]
name = "BeetrootSkin"
description = "Food and hunger information for Minecraft Bedrock Edition"
tags = ["visual", "utility", "hud", "food", "tooltip"]
logo = "https://raw.githubusercontent.com/MiracleForest/BeetrootSkin/main/docs/logo.png"

# BeetrootSkin is compiled against one LeviLamina line at a time, so every supported line is a
# variant named after it: 26_51 for LeviLamina 26.51.x (Minecraft 1.26.51), 26_60 for 26.60.x
# (Minecraft 1.26.60). Variant names may only hold [a-z0-9_], hence 26_60 and not 26.60.
# BeetrootSkin is a client-only mod, so every variant has only a client entry (LeviLauncher).
#
# The default variant is the newest supported line. There is no "client" variant: the client
# entry of each variant is what a client install gets.
#
# LeviLamina 26.60.8 and later are lip.toml packages: their default variant holds both builds and
# they have no "client" variant. Releases up to 26.60.7, and every 26.51 release, are tooth.json
# packages whose client build is the variant "client" and whose default variant is the server
# build. So the 26.60 client entries depend on plain LeviLamina from 26.60.8 on (an older default
# variant would install the server build on a client), and the 26.51 client entries depend on
# LeviLamina#client.

# --- 26.60 (Minecraft 1.26.60) ------------------------------------------------------------------

[[variants.""]]
side = "client"
platform = "win-x64"
preserve = ["mods/BeetrootSkin/config/"]

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = ">=26.60.8 <26.61.0"

[[variants."".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/beetrootskin-client-win-x64-ll26.60.zip"]

[[variants."26_60"]]
side = "client"
platform = "win-x64"
preserve = ["mods/BeetrootSkin/config/"]

[variants."26_60".deps]
"github.com/LiteLDev/LeviLamina" = ">=26.60.8 <26.61.0"

[[variants."26_60".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/beetrootskin-client-win-x64-ll26.60.zip"]

# --- 26.51 (Minecraft 1.26.51) ------------------------------------------------------------------

[[variants."26_51"]]
side = "client"
platform = "win-x64"
preserve = ["mods/BeetrootSkin/config/"]

[variants."26_51".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.51.*"

[[variants."26_51".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/beetrootskin-client-win-x64-ll26.51.zip"]
