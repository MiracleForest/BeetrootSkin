format = 4
id = "github.com/MiracleForest/BeetrootSkin"
version = "0.1.2"

[info]
name = "BeetrootSkin"
description = "AppleSkin-style food and hunger information for Minecraft Bedrock Edition"
tags = ["visual", "utility", "hud", "food", "tooltip"]
logo = "https://raw.githubusercontent.com/MiracleForest/BeetrootSkin/main/docs/logo.png"

# BeetrootSkin is compiled against one LeviLamina line at a time, so every supported line is a
# variant named after it: 26_51 for LeviLamina 26.51.x (Minecraft 1.26.51), 26_60 for 26.60.x
# (Minecraft 1.26.60). Variant names may only hold [a-z0-9_], hence 26_60 and not 26.60.
#
# The default variant and the variant "client", which is the one LeviLauncher reaches for first
# and the one earlier releases of BeetrootSkin were installed as, are the newest supported line.

# --- 26.60 (Minecraft 1.26.60) ------------------------------------------------------------------

[[variants.""]]
side = "client"
platform = "win-x64"
preserve = ["mods/BeetrootSkin/config/"]

[variants."".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"

[[variants."".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/beetrootskin-client-win-x64-ll26.60.zip"]

[[variants.client]]
side = "client"
platform = "win-x64"
preserve = ["mods/BeetrootSkin/config/"]

[variants.client.deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"

[[variants.client.assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/beetrootskin-client-win-x64-ll26.60.zip"]

[[variants."26_60"]]
side = "client"
platform = "win-x64"
preserve = ["mods/BeetrootSkin/config/"]

[variants."26_60".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"

[[variants."26_60".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/beetrootskin-client-win-x64-ll26.60.zip"]

# --- 26.51 (Minecraft 1.26.51) ------------------------------------------------------------------

[[variants."26_51"]]
side = "client"
platform = "win-x64"
preserve = ["mods/BeetrootSkin/config/"]

[variants."26_51".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.51.*"

[[variants."26_51".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/beetrootskin-client-win-x64-ll26.51.zip"]
